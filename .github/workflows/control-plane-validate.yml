name: Validate AI Resource Control Plane

on:
  pull_request:
    paths:
      - "system/control-plane/**"
      - "scripts/validate_control_plane.py"
      - ".github/workflows/control-plane-validate.yml"
      - "schemas/provenance/**"
      - "examples/provenance/**"
      - "tests/provenance/**"
      - "legal/**"
  push:
    branches:
      - main
    paths:
      - "system/control-plane/**"
      - "scripts/validate_control_plane.py"
      - ".github/workflows/control-plane-validate.yml"
      - "schemas/provenance/**"
      - "examples/provenance/**"
      - "tests/provenance/**"
      - "legal/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            system/control-plane/requirements.txt
            tests/provenance/requirements.txt

      - name: Install validator dependencies
        run: |
          python -m pip install --disable-pip-version-check -r system/control-plane/requirements.txt
          python -m pip install --disable-pip-version-check -r tests/provenance/requirements.txt

      - name: Validate control-plane files
        run: python scripts/validate_control_plane.py

      - name: Validate provenance schema and fixtures
        run: python tests/provenance/validate_provenance.py
