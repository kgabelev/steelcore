      - PROJECT_CONTEXT.md
      - CURRENT_STATE.md
      - DECISIONS.md
      - ROADMAP.md
      - EXECUTION_LEDGER.yaml
      - CLAUDE.md
      - HANDOFF_TEMPLATE.md
    dependencies: []
    acceptance_tests:
      - critical_path_is_visible
      - first_vertical_slice_is_bounded
      - approval_boundaries_are_explicit
      - agent_ownership_rules_are_explicit
