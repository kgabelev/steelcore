repository: kgabelev/steelcore
owner: Kirill Gabelev
current_milestone: M2-canonical-source-import-and-provenance

rules:
  one_branch_or_worktree_per_implementation_agent: true
  overlapping_owned_paths_allowed: false
  independent_review_may_duplicate_analysis: true
  merge_order_follows_dependencies: true
  human_approval_required_for:
    - persona_canon
    - legal_posture
    - public_release
    - external_posting
    - spending
    - destructive_actions
    - production_deployment

workstreams:
  - id: foundation-core
    milestone: M1
    objective: Replace placeholder project documents and expose the critical path.
    owner: GPT-5.6-Thinking
